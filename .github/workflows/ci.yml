name: CI

# Syntax check + unit tests under Lua 5.1 (WoW's Lua), then the BigWigs
# packager as a dry run (-d: build, never upload) and a check of what the
# package holds. CurseForge builds the real release from each tag.
on:
  push:
    branches: [main]
  pull_request:
  # Manual run on a tag: the zip for the GitHub release (AGENTS.md "Releasing").
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      # find, not globs: a glob reaches one level only, and an unmatched
      # pattern is passed through literally.
      - name: Syntax-check every Lua file
        run: |
          count=$(find . -name '*.lua' -not -path './.git/*' | wc -l)
          test "$count" -gt 0 || { echo "no Lua files found - the check would prove nothing"; exit 1; }
          echo "checking $count files"
          find . -name '*.lua' -not -path './.git/*' -print0 | xargs -0 luac5.1 -p

      # The Link addon's LibAccountSync, at the ref .pkgmeta pins
      # (tests/test_link_lib.lua loads it from $LIBACCOUNTSYNC).
      - name: Fetch LibAccountSync at the pinned ref
        run: |
          bash tests/fetch_libaccountsync.sh "$RUNNER_TEMP/LibAccountSync"
          echo "LIBACCOUNTSYNC=$RUNNER_TEMP/LibAccountSync" >> "$GITHUB_ENV"

      - name: Unit tests
        run: |
          set -e
          failed=0
          for t in tests/test_*.lua; do
            echo "-- $t --"
            lua5.1 "$t" || failed=$((failed + 1))
          done
          test "$failed" -eq 0

      # The transfer script's self-test (#12). Real transfers are Windows-only;
      # this proves the checks, not Windows' replace and locking behaviour.
      - name: Transfer script self-test
        shell: pwsh
        run: ./Tools/Transfer-Profiles.ps1 -SelfTest

      # The release package, exactly as CurseForge's packager would build it
      # (pinned to a commit), checked for what it may hold (Tools/check_package.py).
      - name: Package dry run
        uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0
        with:
          args: -d

      - name: Check the package contents
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(.release/*.zip)
          test "${#archives[@]}" -gt 0
          for archive in "${archives[@]}"; do python3 Tools/check_package.py "$archive"; done

      - uses: actions/upload-artifact@v4
        with:
          name: altstablesync-package
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error
